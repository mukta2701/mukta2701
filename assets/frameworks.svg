<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Frameworks: ISO 27001 and SOC 2 for controls and audit evidence, EU AI Act for AI systems, GDPR for privacy, STRIDE and OWASP for threat modelling."><style>
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
