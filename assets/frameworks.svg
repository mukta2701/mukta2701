<svg xmlns="http://www.w3.org/2000/svg" width="880" height="243" viewBox="0 0 880 243" role="img" aria-label="Frameworks: ISO 27001 and SOC 2 for controls and audit evidence, EU AI Act for AI systems, GDPR for privacy, STRIDE and OWASP for threat modelling."><style>
@keyframes wv{to{transform:translateX(calc(-1 * var(--p)))}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes gp{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:fl 6s ease-in-out infinite}
.gp{animation:gp 3s ease-in-out infinite}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#7C3AED"/><stop offset="1.00" stop-color="#D946EF"/></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#059669"/><stop offset="1.00" stop-color="#06B6D4"/></linearGradient><linearGradient id="g-sunset" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#F97316"/><stop offset="1.00" stop-color="#EC4899"/></linearGradient><linearGradient id="g-ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#2563EB"/><stop offset="1.00" stop-color="#06B6D4"/></linearGradient><radialGradient id="orb"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter><clipPath id="c"><rect width="880" height="243" rx="16"/></clipPath></defs><rect width="880" height="243" rx="16" fill="#0F172A"/><text x="30.0" y="45.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0" >Controls &amp; audit evidence</text><rect x="310.0" y="23.0" width="109.7" height="33.0" rx="16.5" fill="url(#g-teal)"/><text x="364.9" y="46.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >ISO 27001</text><rect x="427.7" y="23.0" width="72.5" height="33.0" rx="16.5" fill="url(#g-teal)"/><text x="463.9" y="46.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >SOC 2</text><text x="30.0" y="95.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0" >Assessing AI systems</text><rect x="310.0" y="73.0" width="109.7" height="33.0" rx="16.5" fill="url(#g-violet)"/><text x="364.9" y="96.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >EU AI Act</text><text x="30.0" y="145.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0" >Privacy &amp; data protection</text><rect x="310.0" y="123.0" width="63.2" height="33.0" rx="16.5" fill="url(#g-sunset)"/><text x="341.6" y="146.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >GDPR</text><text x="30.0" y="195.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0" >Threat modelling &amp; testing</text><rect x="310.0" y="173.0" width="81.8" height="33.0" rx="16.5" fill="url(#g-ocean)"/><text x="350.9" y="196.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >STRIDE</text><rect x="399.8" y="173.0" width="72.5" height="33.0" rx="16.5" fill="url(#g-ocean)"/><text x="436.1" y="196.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >OWASP</text></svg>
