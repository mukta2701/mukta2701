<svg xmlns="http://www.w3.org/2000/svg" width="480" height="374" viewBox="0 0 480 374" role="img" aria-label="Pipeline: collect from 7 feeds and NVD, score by CVSS, EPSS and KEV, summarise, then send a digest by severity. Scores of 90 or more send an immediate alert."><style>
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3DFFA0" stop-opacity=".10"/><stop offset="1" stop-color="#3DFFA0" stop-opacity="0"/></linearGradient>
</defs><rect x="0.5" y="0.5" width="479.0" height="373.0" rx="12" fill="#0D1319" stroke="#1F2A33"/><rect x="0.5" y="0.5" width="479.0" height="373.0" rx="12" fill="url(#sheen)"/><rect x="22.0" y="20.0" width="290.0" height="64.0" rx="10" fill="#0A0F14" stroke="#4CC9F0" stroke-opacity=".7"/><text x="36.0" y="48.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#4CC9F0" filter="url(#glow)">Collect</text><text x="36.0" y="68.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#C9D1D9">7 feeds + NVD</text><path class="dash" d="M167.0 86 V108" stroke="#6E7B88" stroke-width="2" fill="none"/><rect x="22.0" y="110.0" width="290.0" height="64.0" rx="10" fill="#0A0F14" stroke="#3DFFA0" stroke-opacity=".7"/><text x="36.0" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#3DFFA0" filter="url(#glow)">Score</text><text x="36.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#C9D1D9">CVSS · EPSS · KEV</text><path class="dash" d="M167.0 176 V198" stroke="#6E7B88" stroke-width="2" fill="none"/><rect x="22.0" y="200.0" width="290.0" height="64.0" rx="10" fill="#0A0F14" stroke="#FFB454" stroke-opacity=".7"/><text x="36.0" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#FFB454" filter="url(#glow)">Summarise</text><text x="36.0" y="248.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#C9D1D9">8 structured fields</text><path class="dash" d="M167.0 266 V288" stroke="#6E7B88" stroke-width="2" fill="none"/><rect x="22.0" y="290.0" width="290.0" height="64.0" rx="10" fill="#0A0F14" stroke="#B79CFF" stroke-opacity=".7"/><text x="36.0" y="318.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#B79CFF" filter="url(#glow)">Digest</text><text x="36.0" y="338.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#C9D1D9">grouped by severity</text><path class="dash" d="M314 142.0 H332" stroke="#FF5F57" stroke-width="2" fill="none"/><rect x="334.0" y="110.0" width="130.0" height="64.0" rx="10" fill="#0A0F14" stroke="#FF5F57" stroke-opacity=".7" stroke-dasharray="5 5"/><text x="348.0" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#FF5F57" filter="url(#glow)">Alert</text><text x="348.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#C9D1D9">score ≥ 90</text></svg>
