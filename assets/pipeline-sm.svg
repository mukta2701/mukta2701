<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-label="Pipeline: collect from 7 feeds and NVD, score by CVSS, EPSS and KEV, summarise, then send a digest by severity. Scores of 90 or more send an immediate alert."><style>
@keyframes wv{to{transform:translateX(calc(-1 * var(--p)))}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes gp{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:fl 6s ease-in-out infinite}
.gp{animation:gp 3s ease-in-out infinite}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="g-ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#2563EB"/><stop offset="1.00" stop-color="#06B6D4"/></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#059669"/><stop offset="1.00" stop-color="#06B6D4"/></linearGradient><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#F59E0B"/><stop offset="1.00" stop-color="#EF4444"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#7C3AED"/><stop offset="1.00" stop-color="#D946EF"/></linearGradient><radialGradient id="orb"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter><clipPath id="c"><rect width="480" height="350" rx="16"/></clipPath></defs><rect width="480" height="350" rx="16" fill="#0F172A"/><rect x="18.0" y="18.0" width="290.0" height="62" rx="14" fill="url(#g-ocean)"/><circle cx="42.0" cy="49.0" r="14" fill="#fff" fill-opacity=".25"/><text x="42.0" y="54.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >1</text><text x="66.0" y="46.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start" letter-spacing="0" >Collect</text><text x="66.0" y="65.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#fff" fill-opacity="0.92" text-anchor="start" letter-spacing="0" >7 feeds + NVD</text><path class="dash" d="M163.0 82 V100" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" fill="none"/><rect x="18.0" y="102.0" width="290.0" height="62" rx="14" fill="url(#g-teal)"/><circle cx="42.0" cy="133.0" r="14" fill="#fff" fill-opacity=".25"/><text x="42.0" y="138.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >2</text><text x="66.0" y="130.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start" letter-spacing="0" >Score</text><text x="66.0" y="149.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#fff" fill-opacity="0.92" text-anchor="start" letter-spacing="0" >CVSS · EPSS · KEV</text><path class="dash" d="M163.0 166 V184" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" fill="none"/><rect x="18.0" y="186.0" width="290.0" height="62" rx="14" fill="url(#g-amber)"/><circle cx="42.0" cy="217.0" r="14" fill="#fff" fill-opacity=".25"/><text x="42.0" y="222.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >3</text><text x="66.0" y="214.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start" letter-spacing="0" >Summarise</text><text x="66.0" y="233.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#fff" fill-opacity="0.92" text-anchor="start" letter-spacing="0" >8 structured fields</text><path class="dash" d="M163.0 250 V268" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" fill="none"/><rect x="18.0" y="270.0" width="290.0" height="62" rx="14" fill="url(#g-violet)"/><circle cx="42.0" cy="301.0" r="14" fill="#fff" fill-opacity=".25"/><text x="42.0" y="306.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >4</text><text x="66.0" y="298.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start" letter-spacing="0" >Digest</text><text x="66.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#fff" fill-opacity="0.92" text-anchor="start" letter-spacing="0" >by severity</text><path class="dash" d="M310 133.0 H326" stroke="#F87171" stroke-width="2.5" fill="none"/><rect x="328" y="102" width="138" height="62" rx="14" fill="url(#g-amber)" stroke="#fff" stroke-opacity=".7" stroke-dasharray="5 4"/><text x="397.0" y="130.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >Alert</text><text x="397.0" y="149.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#fff" fill-opacity="0.92" text-anchor="middle" letter-spacing="0" >score ≥ 90</text></svg>
