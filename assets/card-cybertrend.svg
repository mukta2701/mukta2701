<svg xmlns="http://www.w3.org/2000/svg" width="880" height="212" viewBox="0 0 880 212" role="img" aria-label="cybertrend-intelligence: daily threat-intelligence digest from 7 feeds plus NVD, ranked by exploitability."><style>
@keyframes fade{from{opacity:0}to{opacity:1}}
