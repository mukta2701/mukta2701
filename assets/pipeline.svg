.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#fff" fill-opacity="0.92" text-anchor="start" letter-spacing="0" >score ≥ 90</text></svg>
