<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-label="Pipeline: collect from 7 feeds and NVD, score by CVSS, EPSS and KEV, summarise, then send a digest by severity. Scores of 90 or more send an immediate alert."><style>
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
