<svg xmlns="http://www.w3.org/2000/svg" width="480" height="153" viewBox="0 0 480 153" role="img" aria-label="Frameworks: ISO 27001, SOC 2, EU AI Act, GDPR, STRIDE and OWASP"><style>
@keyframes wv{to{transform:translateX(calc(-1 * var(--p)))}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes gp{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes rot{0%{opacity:0;transform:translateY(14px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-14px)}}
.fl{animation:fl 6s ease-in-out infinite}
.gp{animation:gp 3s ease-in-out infinite}
.rot{animation:rot 6s ease infinite both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#059669"/><stop offset="1.00" stop-color="#06B6D4"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#7C3AED"/><stop offset="1.00" stop-color="#D946EF"/></linearGradient><linearGradient id="g-sunset" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#F97316"/><stop offset="1.00" stop-color="#EC4899"/></linearGradient><linearGradient id="g-ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#2563EB"/><stop offset="1.00" stop-color="#06B6D4"/></linearGradient><radialGradient id="orb"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="480" height="153" rx="16" fill="#0F172A"/><text x="22.0" y="30.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="1.6">FRAMEWORKS I WORK WITH</text><rect x="22.0" y="48.0" width="104.1" height="32.0" rx="16.0" fill="url(#g-teal)"/><text x="74.1" y="70.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" >ISO 27001</text><rect x="134.1" y="48.0" width="69.4" height="32.0" rx="16.0" fill="url(#g-teal)"/><text x="168.8" y="70.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" >SOC 2</text><rect x="211.5" y="48.0" width="104.1" height="32.0" rx="16.0" fill="url(#g-violet)"/><text x="263.6" y="70.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" >EU AI Act</text><rect x="323.6" y="48.0" width="60.7" height="32.0" rx="16.0" fill="url(#g-sunset)"/><text x="354.0" y="70.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" >GDPR</text><rect x="22.0" y="88.0" width="78.1" height="32.0" rx="16.0" fill="url(#g-ocean)"/><text x="61.0" y="110.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" >STRIDE</text><rect x="108.1" y="88.0" width="69.4" height="32.0" rx="16.0" fill="url(#g-ocean)"/><text x="142.8" y="110.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" >OWASP</text></svg>
