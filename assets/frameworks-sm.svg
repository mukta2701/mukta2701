<svg xmlns="http://www.w3.org/2000/svg" width="480" height="343" viewBox="0 0 480 343" role="img" aria-label="Frameworks: ISO 27001 and SOC 2 for controls and audit evidence, EU AI Act for AI systems, GDPR for privacy, STRIDE and OWASP for threat modelling."><style>
@keyframes wv{to{transform:translateX(calc(-1 * var(--p)))}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes gp{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:fl 6s ease-in-out infinite}
.gp{animation:gp 3s ease-in-out infinite}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="g-ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#2563EB"/><stop offset="1.00" stop-color="#06B6D4"/></linearGradient><linearGradient id="g-sunset" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#F97316"/><stop offset="1.00" stop-color="#EC4899"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#7C3AED"/><stop offset="1.00" stop-color="#D946EF"/></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#059669"/><stop offset="1.00" stop-color="#06B6D4"/></linearGradient><radialGradient id="orb"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter><clipPath id="c"><rect width="480" height="343" rx="16"/></clipPath></defs><rect width="480" height="343" rx="16" fill="#0F172A"/><text x="22.0" y="32.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0" >Controls &amp; audit evidence</text><rect x="22.0" y="40.0" width="104.1" height="32.0" rx="16.0" fill="url(#g-teal)"/><text x="74.1" y="62.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >ISO 27001</text><rect x="134.1" y="40.0" width="69.4" height="32.0" rx="16.0" fill="url(#g-teal)"/><text x="168.8" y="62.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >SOC 2</text><text x="22.0" y="108.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0" >Assessing AI systems</text><rect x="22.0" y="116.0" width="104.1" height="32.0" rx="16.0" fill="url(#g-violet)"/><text x="74.1" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >EU AI Act</text><text x="22.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0" >Privacy &amp; data protection</text><rect x="22.0" y="192.0" width="60.7" height="32.0" rx="16.0" fill="url(#g-sunset)"/><text x="52.4" y="214.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >GDPR</text><text x="22.0" y="260.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0" >Threat modelling &amp; testing</text><rect x="22.0" y="268.0" width="78.1" height="32.0" rx="16.0" fill="url(#g-ocean)"/><text x="61.0" y="290.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >STRIDE</text><rect x="108.1" y="268.0" width="69.4" height="32.0" rx="16.0" fill="url(#g-ocean)"/><text x="142.8" y="290.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle" letter-spacing="0" >OWASP</text></svg>
