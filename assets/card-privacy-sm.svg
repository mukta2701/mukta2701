<svg xmlns="http://www.w3.org/2000/svg" width="480" height="292" viewBox="0 0 480 292" role="img" aria-label="privacy-review-agent: offline privacy check for code. 381 benchmark cases, 100% near-miss precision, 460 plus CI tests."><style>
