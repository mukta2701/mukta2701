<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="Mukta Choudhury: AI security, application security and GRC"><style>
@keyframes wv{to{transform:translateX(calc(-1 * var(--p)))}}
