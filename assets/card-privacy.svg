<svg xmlns="http://www.w3.org/2000/svg" width="880" height="262" viewBox="0 0 880 262" role="img" aria-label="privacy-review-agent: offline privacy check for code. 381 benchmark cases, 100% near-miss precision, 460 plus CI tests."><style>
